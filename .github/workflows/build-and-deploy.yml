name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      jolt_ref:
        description: "Jolt C++ ref: tag or branch name that exists on GitHub (e.g. nilo-v5.5.0 or master). Push paired tags first: git push origin nilo-v5.5.0"
        required: false
        default: "nilo-v5.5.0"
        type: string
      dry_run:
        description: "If true, build only (skip gh-pages, npm publish, and GitHub Release)."
        required: false
        default: true
        type: boolean

permissions:
  id-token: write # Required for OIDC
  contents: write # Examples gh-pages + checkout
  packages: write # GitHub Packages (@nilo-technologies/jolt-physics)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Paired tag with JoltPhysics.js; keep in sync with CMake default JOLT_PHYSICS_GIT_TAG.
      # workflow_dispatch can override via the jolt_ref input.
      JOLT_PHYSICS_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.jolt_ref || 'nilo-v5.5.0') || 'nilo-v5.5.0' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    # Shallow fetch (checkout default depth=1) often cannot resolve tags; depth=0 fixes that once the ref exists on GitHub.
    - name: Verify Jolt ref exists on GitHub
      env:
        JOLT_REF: ${{ env.JOLT_PHYSICS_CHECKOUT_REF }}
      run: |
        set -euo pipefail
        URL="https://github.com/nilo-technologies/JoltPhysics"
        out="$(git ls-remote "$URL" "refs/tags/${JOLT_REF}" "refs/heads/${JOLT_REF}" 2>/dev/null || true)"
        if [ -n "${out}" ]; then
          echo "Resolved Jolt ref on ${URL}:"
          echo "${out}"
          exit 0
        fi
        if echo "${JOLT_REF}" | grep -qE '^[0-9a-f]{40}$'; then
          echo "JOLT_REF looks like a full SHA; skipping tag/branch preflight."
          exit 0
        fi
        echo "::error::Ref '${JOLT_REF}' not found on ${URL} as a tag or branch. Push it (e.g. git push origin ${JOLT_REF}) or re-run with jolt_ref=master until tags are published."
        exit 1

    - name: Checkout Jolt (C++)
      uses: actions/checkout@v6
      with:
        repository: nilo-technologies/JoltPhysics
        ref: ${{ env.JOLT_PHYSICS_CHECKOUT_REF }}
        path: JoltPhysics
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@nilo-technologies'

    - name: Build
      run: ./ci/build-examples.sh
      shell: bash
      env:
        # ci/build-examples.sh passes this as -DJOLT_PHYSICS_PATH so the job uses the checkout above (not FetchContent).
        NILO_CI_JOLT_PHYSICS_PATH: ${{ github.workspace }}/JoltPhysics

    - name: Deploy Examples
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Examples
        force_orphan: true

    - name: Upload dist (dry run artifact)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: jolt-physics-dist
        path: dist/

    # Matches ci/npm-publish.sh: only first publish of this version gets a GitHub Release with dist artifacts.
    - name: Check whether npm version will be published
      id: pkg_publish
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(node -pe "require('./package.json').version")
        NAME=$(node -pe "require('./package.json').name")
        REGISTRY=$(node -pe "require('./package.json').publishConfig?.registry || 'https://registry.npmjs.org'")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        if npm view "${NAME}@${VERSION}" version --registry="${REGISTRY}" >/dev/null 2>&1; then
          echo "would_publish=false" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is already on ${REGISTRY}; skipping dist pack + GitHub Release for this run."
        else
          echo "would_publish=true" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is not on ${REGISTRY}; npm publish and GitHub Release will follow."
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Pack dist for GitHub Release
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.pkg_publish.outputs.would_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.pkg_publish.outputs.version }}"
        {
          echo "npm_package_version=${VERSION}"
          echo "jolt_cpp_checkout_ref=${JOLT_PHYSICS_CHECKOUT_REF}"
          echo "joltphysics_js_repository=${GITHUB_REPOSITORY}"
          echo "joltphysics_js_sha=${GITHUB_SHA}"
          echo "github_event=${GITHUB_EVENT_NAME}"
          echo "github_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > dist/BUILD_INFO.txt
        tar -czf "jolt-physics-${VERSION}-dist.tar.gz" -C dist .
        ls -la "jolt-physics-${VERSION}-dist.tar.gz"

    - name: Publish NPM
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
      run: ./ci/npm-publish.sh
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release with dist artifacts
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.pkg_publish.outputs.would_publish == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.pkg_publish.outputs.version }}
        name: "jolt-physics ${{ steps.pkg_publish.outputs.version }}"
        body: |
          ## Dist artifacts
          **`jolt-physics-${{ steps.pkg_publish.outputs.version }}-dist.tar.gz`** is a gzip tar of the full **`dist/`** tree from CI (wasm-compat single-file, debug wasm-compat, plain wasm + `.wasm` sidecars, multithread variants, `types.d.ts`, etc.), including **`BUILD_INFO.txt`** with provenance. Use it for Wasm/DWARF debugging, symbolication uploads, or diffing against the npm package contents.

          | Field | Value |
          | --- | --- |
          | npm | `@nilo-technologies/jolt-physics@${{ steps.pkg_publish.outputs.version }}` (GitHub Packages) |
          | Jolt C++ ref | `${{ env.JOLT_PHYSICS_CHECKOUT_REF }}` |
          | JoltPhysics.js SHA | `${{ github.sha }}` |
          | Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
        files: jolt-physics-${{ steps.pkg_publish.outputs.version }}-dist.tar.gz
        fail_on_unmatched_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
